name: image

# Build the development image and publish it to GHCR.
#
# Pushes to main publish :main and :<sha>; tags publish the tag name and
# :latest; pull requests publish :pr-<n>, which their own tests then run on.
# test.yml calls this workflow rather than naming a tag, so the image a branch
# is tested against is the image that branch produces.
#
# Runs on the small slurm-ghr runner. LLVM is not built here: it comes prebuilt
# from the fork's release (m2ndp-llvm-release.yml), so this job only builds the
# timing simulator and unpacks that asset.
#
# The detour submodule and the LLVM release are both private, so the checkout and
# the asset download need SUBMODULE_TOKEN -- a PAT with read access. Without it
# the job fails.

# Branches and pull requests reach this through test.yml, which calls it and
# then tests what came out. Only a release tag builds an image on its own --
# there is nothing to test it against that publishing it does not already do.
#
# Nothing here is path-filtered any more. A filtered build is what leaves a
# tag pointing at an image older than the branch it names, and every caller
# wants the image for the commit it is testing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_toolchains:
        description: >-
          Build LLVM and the timing simulator into the image. Off is for checking that the
          Dockerfile itself is sound without waiting ~25 minutes; the image it
          produces has no compiler in it.
        type: boolean
        default: true
  # test.yml calls this, so what it tests is the image this branch produces
  # rather than whatever :main happens to point at. The digest comes back out.
  workflow_call:
    outputs:
      image:
        description: The image this run published, by digest.
        value: ${{ jobs.build.outputs.image }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: [self-hosted, slurm, x86_64]
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      # Only the detour submodule goes into the build context. The LLVM submodule
      # is not cloned -- that ~GB clone is exactly what the release asset
      # replaces; its pinned commit is read from the superproject tree below and
      # the prebuilt install prefix is downloaded for it.
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      # checkout's credentials are on the superproject only; a manual submodule
      # update fetches over https with none, so inject the token into the URL.
      # detour is private, so this is required, not just for speed. `-c`, not
      # `config --global`: the runner has no $HOME to write a global config to,
      # and -c propagates to the submodule fetch through GIT_CONFIG_PARAMETERS.
      - name: Check out the detour submodule
        env:
          TOKEN: ${{ secrets.SUBMODULE_TOKEN || github.token }}
        run: |
          git -c url."https://x-access-token:${TOKEN}@github.com/".insteadOf="https://github.com/" \
              submodule update --init --recursive third_party/m2ndp-detour

      # The prebuilt LLVM, at the commit the llvm-project gitlink pins. The
      # release's tag is llvm-<first ten of that sha>; a bump to a commit with no
      # release fails here, loudly, rather than silently building against a stale
      # toolchain. gh when the runner has it, else the API with curl + python3
      # (both baseline) -- installing gh on a self-hosted runner needs root.
      # Landed at llvm-asset/llvm.tar.zst, where the Dockerfile unpacks it.
      - name: Fetch the prebuilt LLVM
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          export HOME="${HOME:-$RUNNER_TEMP}"   # gh writes config under $HOME; the runner sets none
          mkdir -p llvm-asset
          sha=$(git ls-tree HEAD third_party/llvm-project | awk '{print $3}')
          tag="llvm-${sha:0:10}"
          repo="PSAL-POSTECH/llvm-project-m2ndp"
          echo "llvm-project pinned at $sha -> release $tag"
          if command -v gh >/dev/null; then
            gh release download "$tag" -R "$repo" -D llvm-asset
            mv llvm-asset/*.tar.zst llvm-asset/llvm.tar.zst
          else
            id=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                   "https://api.github.com/repos/$repo/releases/tags/$tag" \
                 | python3 -c "import sys,json;print(next(a['id'] for a in json.load(sys.stdin)['assets'] if a['name'].endswith('.tar.zst')))")
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
                 "https://api.github.com/repos/$repo/releases/assets/$id" -o llvm-asset/llvm.tar.zst
          fi
          ls -lh llvm-asset/

      # No docker/setup-buildx-action: its docker-container driver boots a
      # moby/buildkit container, which the rootless-podman slurm-ghr builder
      # cannot create ("cannot set cgroup parent"). build-push-action runs on the
      # default builder the runner already provides, which is what detour's CI does.

      # On pull requests too, now that they publish. A pull request's image is
      # what its tests run on, and a hosted runner can only get it by pulling
      # it -- it is built on the self-hosted machine and exists nowhere else.
      # Tagged pr-<n>, so it is replaced rather than accumulated.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No gha cache. type=gha,mode=max uploaded every layer to the Actions
          # cache on top of the registry push -- the whole image over the wire
          # twice each run, the slow part of the job. slurm-ghr runners are
          # ephemeral, so a follow-up may add a gha cache back to skip the base
          # stage; for now the build is left uncached.
          # Skipping the toolchains is a workflow_dispatch choice and nothing
          # else. Testing `inputs.build_toolchains == false` on its own does
          # not say that: on a push there is no such input, and an expression
          # comparing null against false casts both to 0 and comes out true --
          # so every image published from main was built with the skip branch
          # taken, and had no compiler in it.
          build-args: |
            BUILD_TOOLCHAINS=${{ github.event_name == 'workflow_dispatch' && inputs.build_toolchains == false && '0' || '1' }}

      # By digest, not by tag: this is the image this run built, whatever else
      # has since been pushed to the same tag. It is what a caller gets back
      # and what the tests then run on.
      #
      # The registry path has to be lowercase and the repository name is not.
      - id: ref
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"

      # An image without a compiler in it is what this job exists to not
      # publish, and nothing noticed when it did: the build succeeds either
      # way, the skip branch leaving the directories behind empty. So ask the
      # image whether the tools are in it. Skipped only for a deliberate skip.
      - name: The published image carries the toolchains
        if: >-
          !(github.event_name == 'workflow_dispatch'
            && inputs.build_toolchains == false)
        run: |
          docker run --rm "${{ steps.ref.outputs.image }}" sh -c '
            set -e
            test -x /work/build/llvm/bin/llc
            test -x /work/build/llvm/bin/ld.lld
            test -f /work/build/llvm/lib/cmake/llvm/LLVMConfig.cmake
            ls /work/build/llvm/lib/libLLVM*.so* >/dev/null
            test -x /work/third_party/m2ndp-detour/build/bin/m2ndp_run
          '
