name: image

# Build the development image and publish it to GHCR.
#
# Pull requests build the image but do not push, so a broken Dockerfile is
# caught without publishing anything. Pushes to main publish :main and :<sha>;
# tags publish the tag name and :latest.
#
# Runs on a self-hosted runner. The image builds both toolchains, and LLVM
# alone is around 25 minutes on 30 cores -- on a 4-core hosted runner that is
# hours, and the source and build trees together want more disk than one has
# free. A self-hosted runner also keeps the checkout and the layer cache
# between runs, so the submodules are not re-cloned every time.
#
# The LLVM submodule is a private repository, so checkout needs SUBMODULE_TOKEN
# -- a PAT with read access. Without it the job fails at checkout.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      # What goes into the image, not just what builds it. The toolchains are
      # baked in, so what decides them belongs here too -- the build scripts,
      # the Spike extension, and the submodule pointers. Leaving those out
      # publishes an image whose compiler is not main's, which is worse than
      # having no image at all.
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yml
      - scripts/setup.sh
      - scripts/build-llvm.sh
      - scripts/build-spike.sh
      - sim/ext/**
      - third_party
  pull_request:
    paths:
      # What goes into the image, not just what builds it. The toolchains are
      # baked in, so what decides them belongs here too -- the build scripts,
      # the Spike extension, and the submodule pointers. Leaving those out
      # publishes an image whose compiler is not main's, which is worse than
      # having no image at all.
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yml
      - scripts/setup.sh
      - scripts/build-llvm.sh
      - scripts/build-spike.sh
      - sim/ext/**
      - third_party
  workflow_dispatch:
    inputs:
      build_toolchains:
        description: >-
          Build LLVM and Spike into the image. Off is for checking that the
          Dockerfile itself is sound without waiting ~25 minutes; the image it
          produces has no compiler in it.
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write

    steps:
      # Both submodules have to be in the build context: the image cannot clone
      # the private one without carrying a token in a layer.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - uses: docker/setup-buildx-action@v3

      # Skipped on pull_request: forks have no write access to the registry,
      # and nothing is pushed from a PR anyway.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Skipping the toolchains is a workflow_dispatch choice and nothing
          # else. Testing `inputs.build_toolchains == false` on its own does
          # not say that: on a push there is no such input, and an expression
          # comparing null against false casts both to 0 and comes out true --
          # so every image published from main was built with the skip branch
          # taken, and had no compiler in it.
          build-args: |
            BUILD_TOOLCHAINS=${{ github.event_name == 'workflow_dispatch' && inputs.build_toolchains == false && '0' || '1' }}

      # An image without a compiler in it is what this job exists to not
      # publish, and nothing noticed when it did: the build succeeds either
      # way, the skip branch leaving the directories behind empty. So ask the
      # image it just pushed, by digest rather than by tag, whether the tools
      # are in it. Skipped for a deliberate skip, and on pull requests, which
      # push nothing to pull.
      - name: The published image carries the toolchains
        if: >-
          github.event_name != 'pull_request'
          && !(github.event_name == 'workflow_dispatch'
               && inputs.build_toolchains == false)
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          docker run --rm "${image,,}" sh -c '
            set -e
            test -x /work/build/llvm/bin/llc
            test -x /work/build/llvm/bin/ld.lld
            test -x /work/build/spike/install/bin/spike
            test -s /work/build/spike/libm2ndp_ext.so
          '
