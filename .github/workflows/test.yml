name: test

# Compile every workload and run it on M²NDP-Detour.
#
# The tests run on the small slurm-ghr runner and build no toolchain: the image
# carries Mojo, our LLVM and the simulator, so a job pulls it and runs the
# scripts. Hosted runners are billing-gated for this org, so these take a slurm
# runner too, not just the image build.
#
# The image comes from image.yml, called rather than named: what the tests run
# on is the image built from this same commit, by digest. Naming a tag instead
# is how a branch ends up tested against an image built from something else --
# including, for a while, an image with no compiler in it at all.
#
# The checkout is what is tested, not the copy baked into the image: the
# workspace is its own directory and `build` is a link to the image's tools.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch, and cancel a superseded one: a stuck run must not sit on
# the single self-hosted runner blocking the queue. If a cancellation interrupts
# `git submodule update`, the image build clears the stale index.lock cheaply
# (no re-clone), so cancelling is safe.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The toolchains, and the image that carries them. Everything below runs
  # inside what this publishes.
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # The test hierarchy, one entry point: scripts/test.sh runs the tiers cheapest
  # first (t0 toolchain, t1 codegen, t2 device_main on the controller, t3 op
  # kernels, t4 workload E2E) and prints one PASS/FAIL per case -- the simulator's
  # own firehose is swallowed, so a failed case reads at a glance. See tests/.
  test:
    needs: image
    runs-on: [self-hosted, slurm, x86_64]
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # The image's toolchains, at the path the scripts look for them at. Not a
      # mount over /work: that is where they live.
      - name: Point at the image's toolchains
        run: ln -s /work/build build

      # M2NDP_DET points at the detour asset baked into the image (harnesses,
      # configs, device_main fixtures); the tiers draw the rest from tests/.
      - name: Run the test hierarchy
        env:
          M2NDP_DET: /work/third_party/m2ndp-detour
        run: ./scripts/test.sh

      # Kept when a case fails, that being when the generated code is what you
      # want to read. Never fatal: the artifact store is a shared quota that can
      # be full for reasons unrelated to this branch, and losing the upload is
      # not losing the result.
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: device-code
          path: out/
          retention-days: 7
