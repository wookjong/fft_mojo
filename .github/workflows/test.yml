name: test

# Compile every workload and run it on M²NDP-Detour.
#
# The tests run on GitHub-hosted runners and build no toolchain: the image
# carries Mojo, our LLVM and the simulator, so a job pulls it and runs the
# scripts. Building that image is the part that needs the self-hosted runner
# (25 minutes and a lot of disk), and it is the one job here that uses it.
#
# The image comes from image.yml, called rather than named: what the tests run
# on is the image built from this same commit, by digest. Naming a tag instead
# is how a branch ends up tested against an image built from something else --
# including, for a while, an image with no compiler in it at all.
#
# The checkout is what is tested, not the copy baked into the image: the
# workspace is its own directory and `build` is a link to the image's tools.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch, and cancel a superseded one: a stuck run must not sit on
# the single self-hosted runner blocking the queue. If a cancellation interrupts
# `git submodule update`, the image build clears the stale index.lock cheaply
# (no re-clone), so cancelling is safe.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The toolchains, and the image that carries them. Everything below runs
  # inside what this publishes.
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # The artifacts: device IR and assembly for every workload, and the checks
  # that read them. This is where a codegen regression shows up -- an atomic
  # that stopped being one instruction, a kernel that grew a frame -- without
  # anything having to run.
  artifacts:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # The image's toolchains, at the path the scripts look for them at. Not a
      # mount over /work: that is where they live.
      - name: Point at the image's toolchains
        run: ln -s /work/build build

      - run: ./scripts/build.sh
      - run: ./scripts/verify.sh

      # Kept when a check fails, that being when the generated code is what you
      # want to read. Never fatal: the artifact store is a shared quota that
      # can be full for reasons that have nothing to do with this branch, and
      # losing the upload is not losing the result.
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: device-code
          path: out/
          retention-days: 7

  # A workload compiled to a controller image and run on M²NDP-Detour's timing
  # core: device_main launches the kernels on the units and the harness checks
  # the answer. The Detour harnesses are baked into the image; M2NDP_DET points
  # at them.
  timing:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: Point at the image's toolchains
        run: ln -s /work/build build
      - name: Run vector_add on Detour's controller
        env:
          M2NDP_DET: /work/third_party/m2ndp-detour
        run: ./scripts/timing-run.sh vector_add
