# The NDP hardware a run is modelled on. Not the workload: a task says nothing
# about cores, and a launch takes no argument for it -- the runtime reads this
# and configures itself.
#
# Point M2NDP_MACHINE_CONFIG at another file to model a different machine.

# NDP cores.
cores = 1

# Bytes of a task's range one microthread is mapped to -- the granule kernels
# are written against, so a workload does not choose it. Must match the PACKET
# the library was built with; a launch refuses a machine that disagrees.
#
# 32 is M2NDP-public's: MEM_ACCESS_SIZE, CMakeLists.txt:70.
packet = 32

# Bytes of the range handed to one core before moving to the next. Bytes, as
# the reference's is, so it keeps its meaning when the packet changes.
#
# 256 is M2NDP-public's: src/m2ndp_config.h:223 m_stride_size, a literal that
# no config of theirs sets. See test/interleave.cases.
stride = 256

# The shared memory pool: where it is and how big. Host and device both map
# it here, which is what makes a pointer mean the same thing to each, so
# nothing else may sit at this address in either. Must be above the memory
# spike is given with -m.
pool_base = 1073741824
pool_bytes = 67108864
