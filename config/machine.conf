# The NDP hardware a run is modelled on.
#
# This is the machine, not the workload. A task says nothing about how many
# cores it runs on, and a launch takes no argument for it -- the runtime reads
# this file and configures itself. Changing what the answer is computed on is
# a change here, not in a benchmark.
#
# cores        how many NDP cores the model has
# interleave   how many microthreads are handed to one core before moving to
#              the next -- a count of microthreads, not bytes. 1 is the finest
#              spread; uthreads-per-core gives each core one contiguous block.
#              Real hardware interleaves so that a task's data is spread
#              across cores rather than left on one.
#
#              How much data one microthread takes is not here: that is the
#              task's packet, and it belongs to the kernel that was written
#              against it.
#
# Point M2NDP_MACHINE_CONFIG at another file to model a different machine;
# scripts/host-run.sh does that to check an answer does not depend on it.

cores = 1
interleave = 1
